name: TokenTracker
options:
  bundleIdPrefix: com.tristandeschler
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: L2Q787SW8C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  UsageKit:
    path: Packages/UsageKit
targets:
  TokenTrackerMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
      - path: Apps/Shared/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: UsageKit
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Token Tracker
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        # iCloud needs a paid Apple Developer team; build with TT_ICLOUD=YES to enable sync.
        TT_ICLOUD: "NO"
        CODE_SIGN_ENTITLEMENTS: Apps/Mac/Entitlements/iCloud-$(TT_ICLOUD).entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.tristandeschler.TokenTracker
        PRODUCT_NAME: Token Tracker
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
  TokenTrackerIOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - path: Apps/Shared/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: UsageKit
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Token Tracker
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Apps/iOS/TokenTrackerIOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.tristandeschler.TokenTracker]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristandeschler.TokenTracker.ios
        PRODUCT_NAME: Token Tracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TokenTrackerMac:
    build:
      targets:
        TokenTrackerMac: all
    run:
      config: Debug
  TokenTrackerIOS:
    build:
      targets:
        TokenTrackerIOS: all
    run:
      config: Debug
