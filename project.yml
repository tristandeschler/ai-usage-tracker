name: TokenTracker
options:
  bundleIdPrefix: com.tristandeschler
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: L2Q787SW8C
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  UsageKit:
    path: Packages/UsageKit
targets:
  TokenTrackerMac:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
      - path: Apps/Shared/AppIcon.icon
        buildPhase: resources
      - path: Apps/Shared/Brand.xcassets
        buildPhase: resources
    dependencies:
      - package: UsageKit
    info:
      path: Apps/Mac/Info.plist
      properties:
        CFBundleDisplayName: Token Tracker
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tristandeschler.TokenTracker
        PRODUCT_NAME: Token Tracker
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TokenTrackerMac:
    build:
      targets:
        TokenTrackerMac: all
    run:
      config: Debug
