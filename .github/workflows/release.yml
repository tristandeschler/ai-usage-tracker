name: Release

# Every merge to main that changes the app ships a signed, notarized release, which the
# in-app updater then installs. Docs-only changes don't release. Run it by hand from the
# Actions tab to release on demand.
on:
  push:
    branches: [main]
    paths:
      - "Apps/**"
      - "Packages/UsageKit/Sources/**"
      - "Packages/UsageKit/Package.swift"
      - "Config/Base.xcconfig"
      - "project.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the version
        id: version
        run: |
          version=$(Scripts/next-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version already exists; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the signing secrets are set
        if: steps.version.outputs.skip != 'true'
        env:
          ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY" ]; then
            echo "::error::Add the ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID secrets (see RELEASING.md)."
            exit 1
          fi

      - name: Run the tests
        if: steps.version.outputs.skip != 'true'
        run: swift test --package-path Packages/UsageKit

      # Installed before the key is available, so Homebrew never has access to it.
      - name: Install XcodeGen
        if: steps.version.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Write the build settings
        if: steps.version.outputs.skip != 'true'
        run: |
          cat > Config/Local.xcconfig <<CONFIG
          DEVELOPMENT_TEAM = ${{ vars.DEVELOPMENT_TEAM }}
          TT_BUNDLE_PREFIX = ${{ vars.TT_BUNDLE_PREFIX }}
          TT_ENTITLEMENTS = Apps/Mac/TokenTracker.entitlements
          CONFIG

      - name: Build, notarize and publish
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: "1"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH")
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          export RELEASE_NOTES="$(git log -1 --format=%B)"
          Scripts/release.sh
